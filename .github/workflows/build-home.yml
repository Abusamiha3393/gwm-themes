name: Build Haval Home

on:
  push:
    branches: [main]
    paths:
      - "home/**"
      - ".github/workflows/build-home.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::أضف السر KEYSTORE_PASSWORD في Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/HavalHome-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HavalHome-apk
          path: home/out/*.apk

      # make_latest=false حتى لا يظن محدّث صحراء داش أن هذا إصداره
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: home-${{ github.run_number }}
          name: منزلي 1.0.${{ github.run_number }}
          body: |
            تطبيق «منزلي» للتحكم بالبيت عبر Home Assistant من شاشة الهافال بملء الشاشة.
            سجّل الدخول بحساب Home Assistant من الترس داخل التطبيق.
          make_latest: "false"
          files: home/out/*.apk
