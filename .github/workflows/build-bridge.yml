name: Build HAVAL Bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/build-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::أضف السر KEYSTORE_PASSWORD في Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        # تطبيق الجوال يُبنى أولًا ويُضمَّن داخل تطبيق الشاشة، فتقدّمه الشاشة عبر QR
        run: |
          gradle :phone:assembleRelease --no-daemon --stacktrace
          mkdir -p car/src/main/assets
          cp phone/build/outputs/apk/release/phone-release.apk car/src/main/assets/phone.apk
          gradle :car:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp car/build/outputs/apk/release/car-release.apk "out/HavalBridge-0.2.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HavalBridge-apk
          path: bridge/out/*.apk

      # make_latest=false حتى لا يظن محدّث صحراء داش أن هذا إصداره
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bridge-${{ github.run_number }}
          name: جسر الهافال 0.2.${{ github.run_number }}
          body: |
            تطبيق واحد يُثبّت على شاشة الهافال. الجوال يتصل بمسح رمز QR من الشاشة،
            ومن الصفحة نفسها يمكن تثبيت تطبيق Android المضمَّن اختياريًا.
          make_latest: "false"
          files: bridge/out/*.apk
